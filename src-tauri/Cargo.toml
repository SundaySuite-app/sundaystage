[package]
name = "sundaystage"
version = "0.6.0-beta.1"
description = "Live presentation app for churches — companion to SundayRec"
authors = ["Richard Fossland"]
edition = "2021"
default-run = "sundaystage"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sundaystage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Crash-isolated live output (Phase 5.2). Runs in a **separate OS process** so a
# crash in the main UI never blanks the projector. Speaks the line-delimited
# `OutputMessage`/`OutputAck` protocol from `output::mod` over stdio.
[[bin]]
name = "sundaystage-output"
path = "src/bin/output.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Single-instance guard (live-safety, A1). A second launch — the classic one is
# a Dock click after the UI has hung — must NOT start a second process: two
# processes would open the same SQLite file with no cross-process lock (the pool
# in `db::Database::open` is per-process — WAL only gives reader/writer
# concurrency, not mutual exclusion), and two crash-isolated output children
# would fight over the projector mid-service. The crate is `#![cfg(not(mobile))]`,
# so every reference to it is `#[cfg(desktop)]`-gated. v2 matches the Tauri 2 line.
tauri-plugin-single-instance = "2"
# Shared Sunday Account (SSO): read the cross-app session this app shares with
# the rest of the suite (login happens in SundayRec). Distributed by git tag
# (see sunday-platform README) so each app builds standalone in CI — a path dep
# would break the single-repo checkout. For local sunday-auth co-dev, override
# with a `[patch]` in .cargo/config.toml.
sunday-auth = { git = "https://github.com/richardfossland/sunday-platform.git", tag = "v0.4.1" }
# Canonical cross-app wire contracts (the StageManifest type lives here too —
# `manifest.rs` re-exports it instead of keeping a hand-rolled mirror). Same
# git-tag distribution as sunday-auth: no path dep, builds standalone in CI.
sunday-contracts = { git = "https://github.com/richardfossland/sunday-platform.git", tag = "v0.4.1" }

# Auto-update (Phase 13.2) — desktop only; see lib.rs `#[cfg(desktop)]`.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# System keychain for the Anthropic API key (Phase 4.1). Native backends per
# platform; sync-secret-service (pure-Rust zbus) on Linux.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Poison-free mutexes for the live path. A panic while holding a `std::sync::
# Mutex` poisons it, so every later `.lock()` panics too — exactly the cascade
# that could blank the projector mid-service. `parking_lot::Mutex` cannot be
# poisoned: `.lock()` returns the guard directly, so a stray panic in one cue
# can never wedge the live commands. Already in the tree transitively (tauri/
# sqlx), so this adds no new compiled crate.
parking_lot = "0.12"

# Data layer
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono", "uuid"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Type generation for the frontend (run with `cargo test export_bindings`)
ts-rs = { version = "12", features = ["serde-compat", "chrono-impl", "uuid-impl"] }

# HTTP client — the `ai` feature (Anthropic) and library publish (desktop →
# cloud) both use it. Core (non-optional) since publish ships in the default build.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# ProPresenter 6 `.pro6` song import (Spor B4) — the file is XML. `quick-xml`
# (MIT) is already compiled into the tree transitively: `plist` (pulled by the
# Tauri macOS bundler) depends on it, so declaring it direct adds NO new compiled
# crate — the same house rule as parking_lot/sha2/hex/semver below. It is a pure
# pull parser, matching the read-only streaming walk in `import_propresenter`;
# `roxmltree` would have added a brand-new crate (plus `xmlparser`) for no gain.
quick-xml = "0.39"

# Checksum verification for the Bible corpus downloader (Spor C, C1/C2). A
# downloaded corpus is verified against a pinned SHA-256 before it is parsed, so
# a moving upstream ref or a corrupted transfer is rejected rather than seeded.
# Both crates are already in the tree transitively (via the TLS/updater stacks),
# so declaring them direct adds no new compiled crate.
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
# Update-direction pin (E2). `tauri-plugin-updater` compares releases with
# `release.version > current_version` over `semver::Version`; the test in
# `services::update_channel` runs that exact expression rather than
# hand-rolling a comparator. Already in the tree transitively (tauri), so this
# adds no new compiled crate.
semver = "1"

[features]
default = []
# Compile the live Anthropic API client (Phase 4). Without it, AI features fall
# back to the local heuristic formatter. Build real AI with `--features ai`.
ai = []
