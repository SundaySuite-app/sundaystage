# cargo-audit configuration — read by the "Dependency audit" CI job (ci.yml),
# which runs `cargo audit` in this directory (the one holding Cargo.lock).
#
# Only UNFIXABLE advisories may be ignored here, each with a justification and
# a condition for removal. Re-check every entry when bumping dependencies.
# Same policy as SundayRec's .cargo/audit.toml.

[advisories]
ignore = [
  # rsa — Marvin Attack, timing side channel (RUSTSEC-2023-0071). No fixed rsa
  # release exists. It is in Cargo.lock only because sqlx 0.8's
  # sqlx-macros-core lists the optional MySQL driver (sqlx-mysql -> rsa); it
  # is never compiled into Stage, which uses SQLite only:
  # `cargo tree -i rsa --target all` is empty.
  # REMOVE when Stage moves to sqlx 0.9, which drops the transitive rsa —
  # SundayRec removed the same ignore that way.
  "RUSTSEC-2023-0071",
  # RUSTSEC-2026-0459 (CVE-2026-119375): bundled SQLite < 3.54.0 can return
  # uninitialised page-cache memory when a database is opened together with
  # a crafted sibling `-wal` file whose page size differs.
  # UNFIXABLE today: libsqlite3-sys 0.39 has the fix, but sqlx-sqlite 0.9.0
  # (the newest sqlx) requires `libsqlite3-sys >=0.30.1, <0.38.0`.
  # NOT EXPOSED: the app only opens its OWN database, `sundaystage.db` in the
  # user's app-data folder (src-tauri/src/lib.rs -> db::Database::open).
  # Song import reads OpenLyrics/.pro6 XML, never a database file. Planting a
  # crafted `-wal` there requires write access to the user's app data, which
  # already means full control of the app.
  # REMOVE when sqlx releases a version that allows libsqlite3-sys >= 0.39 —
  # bump sqlx and delete this entry in the same PR. (Owner approved 2026-11-12.)
  "RUSTSEC-2026-0459",
]
