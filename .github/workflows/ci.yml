name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Pinned: a floating stable + `-D warnings` turns any newly-added clippy lint into a red main. Bump deliberately.
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri needs the system webview + GTK libs to compile on Linux.
      # (ffmpeg for media thumbnails gets added here in its phase.)
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      # pnpm (not npm): the @sunday/contracts dependency uses pnpm's
      # `&path:` git-subdir syntax, which npm cannot resolve.
      - run: pnpm install --frozen-lockfile

      - name: Frontend lint / format / types
        run: |
          pnpm run lint
          pnpm run format:check
          pnpm run typecheck

      - name: Frontend unit tests
        run: pnpm run test

      - name: Rust fmt / clippy / tests
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: End-to-end (Playwright)
        run: |
          pnpm run build
          pnpm exec playwright install --with-deps chromium
          pnpm run test:e2e

  build:
    name: Build (${{ matrix.platform }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@1.98.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Compiles the frontend + the Rust app on both first-class platforms.
      # Bundling/signing/notarization is wired up in Phase 13.2 (distribution).
      - name: Build Tauri app
        run: pnpm exec tauri build --no-bundle

  # RustSec advisories for the app's Rust dependencies. Stage had no such
  # check until 2026-09, which is how rustls 0.23.40 (RUSTSEC-2026-0285) and
  # quick-xml 0.39 (RUSTSEC-2026-0194/-0195, reachable through the .pro6
  # import) went unnoticed. Modelled on SundayRec's "Dependency audit" job.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.98.0

      - name: Install cargo-audit (prebuilt binary)
        uses: taiki-e/install-action@v2
        with:
          # Pinned, as in SundayRec: a new cargo-audit release must not change
          # this job's behaviour without a deliberate bump.
          tool: cargo-audit@0.22.2

      # Runs where Cargo.lock lives, so src-tauri/.cargo/audit.toml — the
      # unfixable-only ignore list, each entry with a removal condition — is
      # the config cargo-audit reads.
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit
