# Build, sign, notarize, and publish SundayStage for macOS + Windows on a
# version tag. Mirrors SundayRec's / SundayEdit's release flow.
#
# Cut a release:   npm version <patch|minor|major>   (bumps package.json)
#                  # bump src-tauri/tauri.conf.json "version" to match
#                  git tag vX.Y.Z && git push origin vX.Y.Z
#
# The tag push triggers this workflow, which produces a DRAFT GitHub Release
# with the signed installers + the updater `latest.json`. Review the draft,
# then publish it.
#
# Since E2 (v0.5.0) installed apps update from the app-scoped rings on the
# shared Sunday update Worker — `updates.sundaysuite.app/v1/update/sundaystage/
# {stable,beta}`. Publishing the GitHub release is therefore only step one: the
# build must then be PROMOTED to a ring before anyone receives it. The GitHub
# `latest.json` is still uploaded because the 0.4.0 fleet polls
# `releases/latest/download/latest.json`; v0.5.0 is that fleet's last GitHub
# hop.
#
# Beta tags (`v0.6.0-beta.1`) are marked as GitHub prereleases so they can
# never become "Latest" for that fleet, and build NSIS only on Windows.
#
# Required repository secrets are documented in docs/DISTRIBUTION.md.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is Apple Silicon (arm64). Universal/Intel is a
          # follow-up (needs a universal target + matching deps).
          # --features ai compiles the real Anthropic client into releases
          # (default = [] ships only the offline heuristic fallback).
          - platform: macos-latest
            args: "--features ai"
          - platform: windows-latest
            args: "--features ai"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (src-tauri)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # pnpm (not npm): @sunday/contracts uses pnpm's `&path:` git-subdir syntax.
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Windows + a `-beta.` tag must build NSIS ONLY. An MSI's ProductVersion
      # is a numeric triple (`x.y.z`) with nowhere to put a prerelease
      # identifier, so the WiX bundler hard-fails on `v0.6.0-beta.1` and takes
      # the whole release with it (SundayRec hit exactly this). Stable tags and
      # macOS keep the bundle set configured in tauri.conf.json.
      - name: Resolve bundle args for this tag
        id: build_args
        shell: bash
        run: |
          args='${{ matrix.args }}'
          if [ "${{ matrix.platform }}" = "windows-latest" ] && \
             [ "${{ contains(github.ref_name, '-beta.') }}" = "true" ]; then
            args="$args --bundles nsis"
            echo "prerelease tag on Windows → NSIS only"
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Build, sign, and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── Updater signing (required) ──────────────────────────────────
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # ── macOS code signing + notarization ───────────────────────────
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization DISABLED 2026-08-08: notarytool returns 403 — the
          # Apple Developer agreement needs re-acceptance (owner task; same
          # blocker as SundayRec). The app still ships CODE-SIGNED via the
          # certificate env above; Gatekeeper shows a first-launch warning.
          # Re-enable by restoring these three lines once the agreement is
          # signed (tauri-action reads APPLE_PASSWORD as the app-specific
          # password — use the APP_SPECIFIC_PASSWORD secret, added 2026-06-09;
          # the old APPLE_PASSWORD secret was stale, notarytool 401):
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "SundayStage ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install. Auto-update is enabled for existing installs."
          releaseDraft: true
          # A `-beta.` tag must NEVER become the GitHub "Latest" release: the
          # 0.4.0 fleet still polls `releases/latest/download/latest.json`, so a
          # beta published as a normal release would be pushed to every church
          # that has not yet hopped onto the ring.
          prerelease: ${{ contains(github.ref_name, '-beta.') }}
          # The real input name. `includeUpdaterJson` (used here until E2) does
          # NOT exist in tauri-action and was silently ignored — latest.json was
          # only ever uploaded because `uploadUpdaterJson` defaults to true.
          # Stating it makes the 0.4.0 fleet's GitHub manifest deliberate:
          # v0.5.0 is that fleet's last GitHub hop, and the ring takes over from
          # there.
          uploadUpdaterJson: true
          args: ${{ steps.build_args.outputs.args }}
